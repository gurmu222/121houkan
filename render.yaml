# Render Blueprint - One to One デモ公開用
# 使い方: GitHubに push 後、Render の Blueprint で本ファイルを指定すれば
#         API + フロントが自動デプロイされます。
services:
  # ─── 投稿API (Node.js) ───
  - type: web
    name: one2one-api
    runtime: docker
    rootDir: api
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 3001
      - key: DATA_FILE
        value: /data/db.json
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASS
        generateValue: true   # 自動生成 / Renderダッシュボードで確認
      - key: ALLOW_ORIGIN
        sync: false            # デプロイ後にフロントURLを設定
    healthCheckPath: /posts

  # ─── 静的フロント ───
  - type: web
    name: one2one-web
    runtime: static
    plan: free
    buildCommand: echo "no build"
    staticPublishPath: ./
    pullRequestPreviewsEnabled: false
